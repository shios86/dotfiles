## unbind all because it all sucks
unbind-key -a

set -g status-interval 1
set -g history-limit 8192
## 256color
set -g default-terminal "tmux-256color"
set -g status-right "#{?window_bigger,[#{window_offset_x}#,#{window_offset_y}] ,} #{pane_current_path} %H:%M:%S %d-%b-%Y"
set -g status-right-length 0

## prefix Ctrl-D akin to i3wm $MOD
set -g prefix C-d
bind-key C-d send-prefix

## split window
bind-key h split-window -h -c "#{pane_current_path}" 
bind-key v split-window -v -c "#{pane_current_path}"
bind-key H split-window -b -h -c "#{pane_current_path}" 
bind-key V split-window -b -v -c "#{pane_current_path}"
## create new window
bind-key n new-window

## select-window
bind-key 1 select-window -t 0
bind-key 2 select-window -t 1
bind-key 3 select-window -t 2
bind-key 4 select-window -t 3
bind-key 5 select-window -t 4
bind-key 6 select-window -t 5
bind-key 7 select-window -t 6
bind-key 8 select-window -t 7
bind-key 9 select-window -t 8
bind-key 0 select-window -t 9

## select pane
bind-key Left select-pane -L
bind-key Down select-pane -D
bind-key Up select-pane -U
bind-key Right select-pane -R

## copy-mode
bind-key c copy-mode
bind-key C-l clear-history

## resize pane
bind-key w resize-pane -U ## up
bind-key s resize-pane -D ## down
bind-key a resize-pane -L ## left
bind-key d resize-pane -R ## right

bind-key q kill-pane
bind-key Q kill-window

bind-key PageUp previous-window
bind-key PageDown  next-window

## tmux command prompt, very useful!
bind-key : command-prompt
bind-key C-y paste-buffer
bind-key l clear-history
