enabled = true
force = true

[notification]
colorize_icons = true

[plugins]
auto_update = "official"

[shell]
password_style = "random"
polkit_agent = true

    [shell.greeter_sync]
    privilege_command = "echo foot -e pkexec > /tmp/noctalia.log"

[theme]
builtin = "Noctalia"
community_palette = "Oxocarbon"
mode = "dark"
source = "wallpaper"
wallpaper_scheme = "soft"

    [theme.templates]
    builtin_ids = [ "btop", "foot", "gtk3", "gtk4", "niri", "qt", "umbriel" ]

[weather]
refresh_minutes = 60

[widget.clock]
format = "{:%c}"
